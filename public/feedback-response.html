<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Event feedback · Duck Dating Apps</title>
  <style>
    :root{--ink:#24231f;--muted:#6e6b63;--cream:#fbfaf4;--card:#fff;--yellow:#f4c948;--pink:#eb7192;--line:#e8e3d7}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 8% 5%,#f7d45655,transparent 25%),radial-gradient(circle at 95% 35%,#ef8fa733,transparent 28%)}
    main{position:relative;width:min(680px,calc(100% - 24px));margin:20px auto 60px}.hero{text-align:center;padding:24px 16px 20px}
    .logo{width:82px;height:auto}.kicker{font-size:12px;font-weight:850;letter-spacing:.13em;text-transform:uppercase;color:#a34d67;margin-top:10px}
    h1{font-size:clamp(28px,7vw,44px);line-height:1.08;margin:10px auto 16px;max-width:650px}.intro{color:var(--muted);max-width:590px;margin:auto;white-space:pre-line}.privacy{display:inline-flex;align-items:center;gap:7px;margin-top:16px;padding:8px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700}
    form{display:grid;gap:12px}.question{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 7px 28px #544b2d0c}.question-title{display:flex;gap:10px;font-weight:780;margin-bottom:14px}.number{color:#ad536c}
    .choices{display:grid;gap:8px}.choice{position:relative;display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;transition:.15s;background:#fff}.choice:hover{border-color:#d9a840;background:#fffdf5}.choice:has(input:checked){border-color:#dba831;background:#fff8dc;box-shadow:0 0 0 2px #f8d86c55}.choice input{accent-color:#c9772c;width:18px;height:18px;margin:0}
    textarea{width:100%;min-height:145px;border:1.5px solid var(--line);border-radius:12px;padding:13px;font:inherit;resize:vertical;outline:0}textarea:focus{border-color:#dba831;box-shadow:0 0 0 3px #f8d86c44}.optional{color:var(--muted);font-weight:500;font-size:13px}
    .submit{border:0;border-radius:999px;background:var(--ink);color:#fff;font:inherit;font-size:16px;font-weight:800;padding:16px 24px;margin-top:8px;cursor:pointer;box-shadow:0 8px 0 #e5b43a;transition:.15s}.submit:hover{transform:translateY(-2px);box-shadow:0 10px 0 #e5b43a}.submit:disabled{opacity:.55}
    .notice,.error{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;text-align:center}.notice h2{font-size:30px;margin:6px 0}.duck{font-size:52px}.error{color:#a52929}.fine{text-align:center;color:var(--muted);font-size:12px;margin-top:15px}
    @media(max-width:520px){main{margin-top:5px}.hero{padding-inline:8px}.question{padding:17px}.choice{padding:11px}h1{font-size:30px}}
  </style>
</head>
<body>
<main id="app"><div class="notice">Loading your one-minute survey…</div></main>
<script>
  const token=new URLSearchParams(location.search).get('token');
  let form;
  const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};
  const attr=v=>esc(v).replace(/"/g,'&quot;');
  function brand(){return `<section class="hero"><img class="logo" src="images/DDA-logo.png" alt="Duck Dating Apps"><div class="kicker">One-minute event check-in</div></section>`}
  async function load(){
    if(!token)return fail('This survey link is missing.');
    try{const r=await fetch(`/api/public-feedback/${token}`),d=await r.json();if(!r.ok)throw Error(d.error);form=d;render()}catch(e){fail(e.message)}
  }
  function render(){
    if(form.is_closed||(form.timer_end&&new Date(form.timer_end)<=new Date()))return fail('This survey is now closed. Thank you for your interest.');
    document.getElementById('app').innerHTML=`${brand()}<section class="hero" style="padding-top:0"><h1>${esc(form.title)}</h1><div class="intro">${esc(form.description)}</div><div class="privacy">🔒 Completely anonymous · about 1 minute</div></section><form id="survey">${(form.questions||[]).map(question).join('')}<button class="submit">Send anonymous feedback →</button><div class="fine">No names, email addresses or identifying information are collected.</div></form>`;
    document.getElementById('survey').addEventListener('submit',submit);
  }
  function question(q,i){
    let input='';
    if(q.type==='single_select'||q.type==='rating'||q.type==='yes_no'){
      const opts=q.type==='rating'?['5','4','3','2','1']:(q.type==='yes_no'?['Yes','No']:(q.options||[]));
      input=`<div class="choices">${opts.map(o=>`<label class="choice"><input type="radio" name="${q.id}" value="${attr(o)}" ${q.required?'required':''}><span>${esc(o)}</span></label>`).join('')}</div>`;
    }else if(q.type==='multiple_select'){
      input=`<div class="choices">${(q.options||[]).map(o=>`<label class="choice"><input type="checkbox" name="${q.id}" value="${attr(o)}"><span>${esc(o)}</span></label>`).join('')}</div>`;
    }else if(q.type==='checkbox'){
      input=`<label class="choice"><input type="checkbox" name="${q.id}" value="true" ${q.required?'required':''}><span>${esc(q.text)}</span></label>`;
    }else input=`<textarea name="${q.id}" placeholder="We'd love to hear your honest feedback. What worked well? What didn't? Any ideas for improving the experience, the matching process or the app?" ${q.required?'required':''}></textarea>`;
    const title=q.type==='checkbox'?'':`<div class="question-title"><span class="number">${String(i+1).padStart(2,'0')}</span><span>${esc(q.text)} ${q.required?'':'<span class="optional">Optional</span>'}</span></div>`;
    return `<section class="question">${title}${input}</section>`;
  }
  async function submit(e){
    e.preventDefault();const answers={};
    for(const q of form.questions||[]){
      if(q.type==='multiple_select')answers[q.id]=[...e.target.querySelectorAll(`[name="${q.id}"]:checked`)].map(x=>x.value);
      else if(q.type==='checkbox')answers[q.id]=!!e.target.querySelector(`[name="${q.id}"]`)?.checked;
      else if(q.type==='text')answers[q.id]=e.target.elements[q.id]?.value||'';
      else answers[q.id]=e.target.querySelector(`[name="${q.id}"]:checked`)?.value||'';
    }
    const button=e.target.querySelector('button');button.disabled=true;button.textContent='Sending…';
    try{const r=await fetch(`/api/public-feedback/${token}/responses`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers})}),d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('app').innerHTML=`${brand()}<div class="notice"><div class="duck">🦆</div><h2>Thank you!</h2><p>${esc(d.message)}</p></div>`;scrollTo(0,0)}catch(err){button.disabled=false;button.textContent='Send anonymous feedback →';alert(err.message)}
  }
  function fail(msg){document.getElementById('app').innerHTML=`${brand()}<div class="error">${esc(msg)}</div>`}
  load();
</script>
</body>
</html>
