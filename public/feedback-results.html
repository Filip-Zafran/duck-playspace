<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Anonymous feedback results · Duck Dating Apps</title>
  <style>
    :root{--ink:#20201d;--muted:#6d6b64;--cream:#fbfaf4;--card:#fff;--yellow:#f5c843;--pink:#ef6f91;--line:#e9e4d7}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
    main{width:min(1080px,calc(100% - 28px));margin:28px auto 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}
    .eyebrow{color:#9b4c65;font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:12px}h1{font-size:clamp(26px,5vw,44px);line-height:1.08;margin:6px 0}.muted{color:var(--muted)}
    .live{display:flex;align-items:center;gap:8px;background:#e9f7ee;color:#22613b;padding:8px 12px;border-radius:999px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:#36a966}
    .summary{display:grid;grid-template-columns:repeat(2,minmax(0,220px));gap:12px;margin:22px 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 5px 22px #524a3210}.stat strong{display:block;font-size:30px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card h2{font-size:17px;margin:0 0 18px}.bar-row{margin:13px 0}.bar-label{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:5px}.track{height:9px;border-radius:8px;background:#eeeae0;overflow:hidden}.fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--yellow),var(--pink))}
    .comments{grid-column:1/-1}.comment{padding:14px 0;border-top:1px solid var(--line);white-space:pre-wrap}.comment:first-of-type{border:0}.empty{color:var(--muted);font-style:italic}
    @media(max-width:700px){.top{display:block}.live{display:inline-flex;margin-top:10px}.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.card{padding:17px}}
  </style>
</head>
<body>
<main id="app"><p>Loading anonymous results…</p></main>
<script>
  const token=new URLSearchParams(location.search).get('token');
  let timer;
  const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};
  const answerValues=v=>Array.isArray(v)?v:(v===undefined||v===null||v===''?[]:[String(v)]);
  function render(data){
    const {form,responses}=data, questions=form.questions||[];
    const choice=questions.filter(q=>['rating','yes_no','single_select','multiple_select'].includes(q.type));
    const text=questions.filter(q=>q.type==='text');
    document.getElementById('app').innerHTML=`
      <div class="top"><div><div class="eyebrow">Duck Dating Apps · Anonymous results</div><h1>${esc(form.event_name||form.title)}</h1><div class="muted">Shareable read-only dashboard. No names, emails or identifying information are collected.</div></div><div class="live"><span class="dot"></span>Live updates</div></div>
      <div class="summary"><div class="stat"><strong>${responses.length}</strong><span class="muted">total responses</span></div><div class="stat"><strong>${choice.length}</strong><span class="muted">questions charted</span></div></div>
      <section class="grid">${choice.map(q=>chart(q,responses)).join('')}
      ${text.map(q=>`<article class="card comments"><h2>${esc(q.text)}</h2>${responses.map(r=>r.answers?.[q.id]).filter(Boolean).map(v=>`<div class="comment">${esc(v)}</div>`).join('')||'<div class="empty">No written responses yet.</div>'}</article>`).join('')}</section>`;
  }
  function chart(q,responses){
    const options=q.type==='rating'?['5','4','3','2','1']:(q.options||[]);
    const counts=Object.fromEntries(options.map(o=>[o,0]));
    responses.forEach(r=>answerValues(r.answers?.[q.id]).forEach(v=>{if(v in counts)counts[v]++}));
    return `<article class="card"><h2>${esc(q.text)}</h2>${options.map(o=>{const n=counts[o]||0,p=responses.length?Math.round(n/responses.length*100):0;return `<div class="bar-row"><div class="bar-label"><span>${esc(o)}</span><strong>${p}% <span class="muted">(${n})</span></strong></div><div class="track"><div class="fill" style="width:${p}%"></div></div></div>`}).join('')}</article>`;
  }
  async function load(){try{const r=await fetch(`/api/public-feedback-results/${token}`);const d=await r.json();if(!r.ok)throw Error(d.error);render(d)}catch(e){document.getElementById('app').innerHTML=`<h1>Results unavailable</h1><p>${esc(e.message||'This link may be invalid.')}</p>`}}
  load();timer=setInterval(load,10000);
</script>
</body>
</html>
